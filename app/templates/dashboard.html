<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5a623" />
  <title>Dashboard – Notes</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    html, body { height: 100%; overflow: auto; }
    .dashboard-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .topbar {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .topbar-brand {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .topbar-brand span { color: var(--accent); }
    .topbar-user {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .btn-logout {
      height: 36px;
      padding: 0 16px;
      background: var(--surface2);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.12s;
    }
    .btn-logout:hover { background: var(--border); }
    .dashboard-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .placeholder-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 48px 40px;
      width: min(480px, 100%);
      text-align: center;
    }
    .placeholder-card .icon { font-size: 56px; margin-bottom: 20px; opacity: 0.6; }
    .placeholder-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }
    .placeholder-card p {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .placeholder-card .badge {
      display: inline-block;
      margin-top: 18px;
      background: #fff8ec;
      color: var(--accent-dark);
      border: 1px solid #fddfa3;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="dashboard-wrap">
    <header class="topbar">
      <div class="topbar-brand">📝 <span>Notes</span></div>
      <div class="topbar-user">
        <span>{{ username }}</span>
        <form method="POST" action="{{ url_for('auth.logout') }}" style="margin:0">
          <button type="submit" class="btn-logout">Sign out</button>
        </form>
      </div>
    </header>

    <main class="dashboard-body">
      <div class="placeholder-card">
        <div class="icon">🗒️</div>
        <h2>Welcome, {{ username }}!</h2>
        <p>You're signed in. Notes are coming soon&nbsp;— check back after Milestone&nbsp;2.</p>
        <span class="badge">Milestone 1 complete ✓</span>
      </div>
    </main>
  </div>
</body>
</html>
