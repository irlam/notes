<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5a623" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Notes" />
  <title>Notes</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">
    <div id="offline-banner">You are offline — changes will sync when reconnected.</div>

    <div class="main-layout">

      <!-- ===== Sidebar ===== -->
      <nav class="sidebar">
        <div class="sidebar-header">
          <h1>📝 Notes</h1>
          <div style="display:flex;align-items:center;gap:8px;">
            <button id="btn-new" class="btn-new" title="New note" aria-label="New note">+</button>
          </div>
        </div>

        <!-- Search bar -->
        <div class="search-bar">
          <input type="search" id="search-input" class="search-input"
            placeholder="Search notes…" autocomplete="off" aria-label="Search notes" />
        </div>

        <!-- Filter tabs -->
        <div class="filter-tabs" role="tablist">
          <button class="filter-tab active" data-filter="active" role="tab" aria-selected="true">Notes</button>
          <button class="filter-tab" data-filter="archived" role="tab" aria-selected="false">Archived</button>
          <button class="filter-tab" data-filter="trashed" role="tab" aria-selected="false">Trash</button>
        </div>

        <!-- Folder section (hidden in Trash view) -->
        <div id="folder-section" class="folder-section">
          <div class="folder-section-header">
            <span class="folder-section-title">Folders</span>
            <button id="btn-new-folder" class="btn-link" title="New folder" aria-label="New folder">＋</button>
          </div>
          <div id="new-folder-form" class="new-folder-form" style="display:none;">
            <input type="text" id="new-folder-input" class="new-folder-input"
              placeholder="Folder name…" maxlength="100" aria-label="New folder name" />
          </div>
          <div id="folder-list" role="list">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Sort bar -->
        <div class="sort-bar">
          <label for="sort-select" class="sort-label">Sort:</label>
          <select id="sort-select" class="sort-select" aria-label="Sort notes">
            <option value="updated_desc">Recently edited</option>
            <option value="created_desc">Newest first</option>
            <option value="title_asc">Title A–Z</option>
          </select>
        </div>

        <div id="note-list" role="list"></div>

        <!-- Sign out at the bottom -->
        <div class="sidebar-footer">
          <span class="sidebar-user">{{ username }}</span>
          <form method="POST" action="{{ url_for('auth.logout') }}" style="margin:0">
            <button type="submit" class="btn-signout">Sign out</button>
          </form>
        </div>
      </nav>

      <!-- ===== Editor Pane ===== -->
      <div class="editor-pane">
        <!-- Welcome / no-note state -->
        <div id="editor-welcome" class="editor-welcome">
          <div class="icon">🗒️</div>
          <p>Select a note or tap <strong>+</strong> to create one.</p>
        </div>

        <!-- Editor content -->
        <div id="editor-content" style="display:none; flex-direction:column; height:100%;">
          <div class="editor-header">
            <button id="btn-back" title="Back to list" aria-label="Back">‹</button>
            <span id="autosave-indicator" class="autosave-indicator" aria-live="polite"></span>
            <select id="note-folder-select" class="note-folder-select"
              title="Move to folder" aria-label="Note folder">
              <option value="">📁 No folder</option>
            </select>
            <button id="btn-pin" class="btn-icon" title="Pin note" aria-label="Pin note">📌</button>
            <button id="btn-archive" class="btn-icon" title="Archive note" aria-label="Archive note">📥</button>
            <button id="btn-trash" class="btn-icon btn-trash-note" title="Move to trash" aria-label="Move to trash">🗑️</button>
            <button id="btn-restore" class="btn-icon" title="Restore note" aria-label="Restore note" style="display:none">↩️</button>
            <button id="btn-delete-permanent" class="btn-icon btn-danger" title="Delete permanently" aria-label="Delete permanently" style="display:none">❌</button>
          </div>

          <!-- Tag bar -->
          <div id="tag-bar" class="tag-bar">
            <div id="tag-chips" class="tag-chips"></div>
            <input type="text" id="tag-input" class="tag-input"
              placeholder="Add tag…" autocomplete="off" aria-label="Add tag"
              list="tag-datalist" maxlength="50" />
            <datalist id="tag-datalist"></datalist>
          </div>

          <div class="editor-body">
            <div
              id="note-title"
              class="note-title-input"
              contenteditable="true"
              role="textbox"
              aria-label="Note title"
              aria-multiline="false"
              spellcheck="true"
            ></div>
            <div
              id="note-body"
              class="note-body-input"
              contenteditable="true"
              role="textbox"
              aria-label="Note body"
              aria-multiline="true"
              spellcheck="true"
            ></div>

            <!-- Image blocks -->
            <div id="image-toolbar" class="image-toolbar" style="display:none;">
              <button id="btn-upload-image" class="btn-image-add" type="button"
                title="Add image from file" aria-label="Add image from file">🖼 Add image</button>
              <button id="btn-camera-capture" class="btn-image-add" type="button"
                title="Capture from camera" aria-label="Capture from camera">📷 Camera</button>
              <!-- Hidden file inputs -->
              <input type="file" id="input-upload-image" accept="image/*"
                style="display:none;" aria-hidden="true" />
              <input type="file" id="input-camera-capture" accept="image/*"
                capture="environment" style="display:none;" aria-hidden="true" />
            </div>
            <div id="image-upload-status" class="image-upload-status" aria-live="polite"></div>
            <div id="image-blocks" class="image-blocks"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm permanent delete dialog -->
  <div id="dialog-overlay" class="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog">
      <h2 id="dialog-title">Delete permanently?</h2>
      <p>This note will be deleted forever and cannot be recovered.</p>
      <div class="dialog-actions">
        <button id="btn-cancel-delete" class="btn btn-cancel">Cancel</button>
        <button id="btn-confirm-delete" class="btn btn-confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <!-- ===== Annotation Editor Modal ===== -->
  <div id="annotation-modal" class="annotation-modal" role="dialog" aria-modal="true"
       aria-label="Annotation editor" style="display:none;">
    <div class="ann-header">
      <!-- Tool buttons -->
      <div class="ann-tools" role="toolbar" aria-label="Annotation tools">
        <button id="ann-tool-pen"         class="ann-tool-btn active" title="Pen (P)"         aria-label="Pen">✏️</button>
        <button id="ann-tool-highlighter" class="ann-tool-btn"        title="Highlighter (H)" aria-label="Highlighter">🖌</button>
        <button id="ann-tool-arrow"       class="ann-tool-btn"        title="Arrow (A)"       aria-label="Arrow">↗</button>
        <button id="ann-tool-rectangle"   class="ann-tool-btn"        title="Rectangle (R)"   aria-label="Rectangle">▭</button>
        <button id="ann-tool-circle"      class="ann-tool-btn"        title="Circle (C)"      aria-label="Circle">◯</button>
        <button id="ann-tool-text"        class="ann-tool-btn"        title="Text (T)"        aria-label="Text label">T</button>
        <input  type="color" id="ann-color"  value="#e74c3c" class="ann-color-input"
                title="Stroke colour" aria-label="Stroke colour" />
        <input  type="range" id="ann-width" min="1" max="20" value="3" class="ann-width-slider"
                title="Stroke width / font size" aria-label="Stroke width" />
      </div>
      <!-- Action buttons -->
      <div class="ann-actions">
        <button id="ann-undo"       class="ann-action-btn" title="Undo (Ctrl+Z)"   aria-label="Undo"       disabled>↩</button>
        <button id="ann-redo"       class="ann-action-btn" title="Redo (Ctrl+Y)"   aria-label="Redo"       disabled>↪</button>
        <button id="ann-zoom-in"    class="ann-action-btn" title="Zoom in"         aria-label="Zoom in">＋</button>
        <button id="ann-zoom-out"   class="ann-action-btn" title="Zoom out"        aria-label="Zoom out">－</button>
        <button id="ann-zoom-reset" class="ann-action-btn" title="Reset view"      aria-label="Reset view">⊡</button>
        <button id="ann-clear"      class="ann-action-btn ann-btn-danger" title="Clear all annotations" aria-label="Clear all">🗑</button>
        <span   id="ann-status"     class="ann-status"     aria-live="polite"></span>
        <button id="ann-save"       class="ann-btn-save"   title="Save (Ctrl+S)"   aria-label="Save annotations">Save</button>
        <button id="ann-cancel"     class="ann-btn-cancel" title="Cancel (Esc)"    aria-label="Cancel">✕</button>
      </div>
    </div>
    <!-- Canvas area -->
    <div id="annotation-canvas-wrap" class="ann-canvas-wrap">
      <div id="annotation-stage" class="ann-stage">
        <img id="ann-source-img" class="ann-source-img" alt="Image being annotated" />
        <canvas id="annotation-canvas" class="ann-canvas"></canvas>
      </div>
    </div>
    <!-- Floating text input for text tool -->
    <textarea id="ann-text-overlay" class="ann-text-overlay"
              rows="1" placeholder="Type text, Enter to place…"
              aria-label="Annotation text input" style="display:none;"></textarea>
  </div>

  <script src="/static/js/annotation.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(console.error);
      });
    }
  </script>
</body>
</html>
